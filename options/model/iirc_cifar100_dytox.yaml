#######################
# DyTox, for CIFAR100 #
#######################

# Model definition
#model: convit
embed_dim: 384
depth: 6
num_heads: 12
patch_size: 4
input_size: 32
local_up_to_layer: 5
class_attention: true

# Training setting
epochs: 200
base_epochs: 400
no_amp: true
eval_every: 50

# Dataset parameters
data_set: iirc_cifar100
tasks_configuration_id: 0

# Base hyperparameter
weight_decay: 0.000001
batch_size: 128
incremental_batch_size: 128
incremental_lr: 0.0005

# buffer and rehearsal parameters
rehearsal: icarl_all
total_n_memories: -1
n_memories_per_class: 20

# Knowledge Distillation
auto_kd: true

# Finetuning
finetuning: balanced
finetuning_epochs: 20
ft_no_sampling: true

# Dytox model
dytox: true
freeze_task: [old_task_tokens, old_heads]
freeze_ft: [sab]

# Divergence head to get diversity
# head_div: 0.1
# head_div_mode: tr--

# Independent Classifiers
ind_clf: 1-1
bce_loss: true


# Advanced Augmentations, here disabled

## Erasing
reprob: 0.0
remode: pixel
recount: 1
resplit: false

## MixUp & CutMix
mixup: 0.0
cutmix: 0.0

# bash train.sh 0,1 --options options/model/iirc_cifar100_dytox.yaml --epochs 5 --base-epochs 10 --eval-every 5 --finetuning-epochs 4